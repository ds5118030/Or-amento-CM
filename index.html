<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Orçamentário — Diretoria Comercial 2026</title>
<style>
  :root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2336;--border:#2a3050;--accent:#4f7af8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--text:#e8eaf0;--muted:#8891a8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:13px;}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  .hdr-title{font-size:15px;font-weight:700;}
  .hdr-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);}
  .dot.loading{background:var(--amber);animation:pulse 1s infinite;}
  .dot.warn{background:var(--amber);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hdr-actions{display:flex;gap:8px;}
  .btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .month-strip{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;background:var(--surface);}
  .month-tab{min-width:85px;padding:9px 10px;text-align:center;cursor:pointer;border-right:1px solid var(--border);border-bottom:3px solid transparent;flex:1;}
  .month-tab:hover{background:var(--surface2);}
  .month-tab.active{border-bottom-color:var(--accent);background:var(--surface2);}
  .month-tab.future{opacity:.45;}
  .mtname{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .month-tab.active .mtname{color:var(--accent);}
  .mtsaldo{font-size:13px;font-weight:700;margin-top:2px;}
  .mtpct{font-size:10px;color:var(--muted);margin-top:1px;}
  .main{display:flex;height:calc(100vh - 104px);overflow:hidden;}
  .left-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .filters-bar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .filter-select,.search-input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 10px;font-size:11px;}
  .search-input{width:180px;}
  .ml-auto{margin-left:auto;}
  .table-panel{flex:1;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead{position:sticky;top:0;z-index:10;}
  thead tr{background:var(--surface2);}
  th{padding:9px 12px;text-align:right;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--border);white-space:nowrap;}
  th:first-child{text-align:left;min-width:230px;position:sticky;left:0;background:var(--surface2);z-index:11;}
  td{padding:8px 12px;border-bottom:1px solid #1a1f30;text-align:right;white-space:nowrap;}
  td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:5;}
  tr:hover td{background:var(--surface2);}
  tr:hover td:first-child{background:var(--surface2);}
  .row-group td{padding:5px 12px;background:var(--surface)!important;font-weight:700;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;border-top:1px solid var(--border);}
  .row-total td{font-weight:700;font-size:13px;border-top:2px solid var(--accent);background:var(--bg)!important;}
  .val-pos{color:var(--green);}.val-neg{color:var(--red);}.val-warn{color:var(--amber);}.val-zero{color:var(--muted);}
  .excesso-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;background:#3b1515;color:var(--red);font-weight:700;margin-left:4px;}
  .atencao-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;background:#2e200a;color:var(--amber);font-weight:700;margin-left:4px;}
  .saldo-panel{width:310px;border-left:1px solid var(--border);overflow-y:auto;background:var(--surface);flex-shrink:0;}
  .saldo-panel-hdr{padding:13px 15px 9px;border-bottom:1px solid var(--border);}
  .sph-title{font-size:13px;font-weight:700;}
  .sph-month{font-size:11px;color:var(--muted);margin-top:1px;}
  .saldo-big{padding:15px;border-bottom:1px solid var(--border);}
  .sb-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
  .sb-value{font-size:24px;font-weight:700;margin-top:4px;}
  .sb-row{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;}
  .kpi-row{display:flex;border-bottom:1px solid var(--border);}
  .kpi{flex:1;padding:10px 13px;border-right:1px solid var(--border);}
  .kpi:last-child{border-right:none;}
  .kpi-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
  .kpi-val{font-size:14px;font-weight:700;margin-top:3px;}
  .detail-section{padding:12px 15px;}
  .ds-title{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
  .detail-item{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #1a1f30;gap:8px;}
  .detail-item:last-child{border-bottom:none;}
  .di-name{font-size:11px;font-weight:500;line-height:1.3;flex:1;}
  .di-meta{text-align:right;}
  .di-saldo{font-size:12px;font-weight:700;}
  .di-pct{font-size:10px;color:var(--muted);}
  .di-bar-wrap{width:100%;height:3px;background:var(--border);border-radius:2px;margin-top:3px;}
  .di-bar{height:100%;border-radius:2px;}
  .insight-box{margin:12px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px;}
  .ib-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:7px;}
  .ib-item{font-size:11px;color:var(--muted);margin-bottom:4px;padding-left:10px;position:relative;}
  .ib-item::before{content:"\25B8";position:absolute;left:0;color:var(--accent);}
  .ib-item strong{color:var(--text);}
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

<div class="hdr">
  <div>
    <div class="hdr-title">Controle Or&#231;ament&#225;rio &#8212; Diretoria Comercial</div>

<div class="month-strip" id="monthStrip"></div>
<div class="main">

      </label>
    </div>
    <div class="table-panel"><table id="budgetTable"></table></div>
  </div>
  <div class="saldo-panel" id="saldoPanel"></div>
</div>

function setStatus(cls,msg){document.getElementById('statusDot').className='dot '+cls;document.getElementById('statusText').textContent=msg;}

function parseCSV(text){
  var lines=text.split(/\r?\n/);
  if(lines.length<2)return[];
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.startsWith('"')&&line.endsWith('"'))line=line.slice(1,-1);
    line=line.replace(/""/g,'\u00a7');
    var parts=line.split(',');
    if(parts.length<5)continue;
    var rel=parts[0].replace(/\u00a7/g,'"').trim();
    var mes=parts[1].replace(/\u00a7/g,'"').trim();
    var grp=parts[2].replace(/\u00a7/g,'"').trim();
    var conta=parts[3].replace(/\u00a7/g,'"').trim();
    var valorRaw=parts.slice(4).join(',').replace(/\u00a7/g,'"').replace(/"/g,'').trim();
    var val=0;
    if(valorRaw.indexOf(',')>=0&&valorRaw.indexOf('.')>=0){
      val=parseFloat(valorRaw.replace(/\./g,'').replace(',','.'))||0;
    }else if(valorRaw.indexOf(',')>=0){
      val=parseFloat(valorRaw.replace(',','.'))||0;
    }else{
      val=parseFloat(valorRaw)||0;
    }
    rows.push({rel:rel,mes:mes,grp:grp,conta:conta,val:val});
  }
  return rows;
}

function buildData(rows){
  var lmap={};
  var mt={};
  MONTHS.forEach(function(m){mt[m]={orcado:0,realizado:0};});
  rows.forEach(function(r){
    var tipo=r.rel.toUpperCase();
    var mes=r.mes.toUpperCase();
    var grp=r.grp.toUpperCase()||'DESPESAS';
    var conta=r.conta;
    var val=r.val;
    if(!conta||tipo.indexOf('---')>=0||MONTHS.indexOf(mes)<0)return;
    if(!lmap[conta]){
      lmap[conta]={conta:conta,agrupamento:grp,meses:{}};
      MONTHS.forEach(function(m){lmap[conta].meses[m]={orcado:0,realizado:0};});
    }
    var isOrc=tipo.indexOf('FORE')>=0||tipo.indexOf('ORC')>=0;
    var isReal=tipo.indexOf('REAL')>=0;
    if(isOrc){lmap[conta].meses[mes].orcado+=val;mt[mes].orcado+=val;}
    else if(isReal){lmap[conta].meses[mes].realizado+=val;mt[mes].realizado+=val;}
  });
  var lines=Object.values(lmap).sort(function(a,b){return a.conta.localeCompare(b.conta,'pt-BR');});
  return{lines:lines,month_totals:mt,month_order:MONTHS};
}

function atualizarDoSheets(){
  setStatus('loading','Buscando dados do Sheets...');
  fetch(SHEETS_URL+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(text){
      var rows=parseCSV(text);
      if(rows.length===0)throw new Error('CSV vazio');
      var nd=buildData(rows);
      if(nd.lines.length===0)throw new Error('Sem linhas');
      DATA=nd;
      setStatus('ok','Sheets · '+new Date().toLocaleTimeString('pt-BR'));
      renderAll();
    })
    .catch(function(e){
      setStatus('warn','Sheets indisponível · usando dados locais');
    });
}

function fmt(v,sign){if(v===0)return'—';var a=Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});return(sign?(v>0?'+':'-'):'')+'R$ '+a;}
function fmtK(v){var a=Math.abs(v);if(a>=1e6)return(v<0?'-':'')+'R$ '+(a/1e6).toFixed(1)+'M';if(a>=1e3)return(v<0?'-':'')+'R$ '+(a/1e3).toFixed(0)+'k';return(v<0?'-':'')+'R$ '+a.toFixed(0);}

function renderStrip(){
  var s=document.getElementById('monthStrip');s.innerHTML='';
  MONTHS.forEach(function(m){
    var mt=DATA.month_totals[m];var isFut=COM_REAL.indexOf(m)<0;
    var rA=Math.abs(mt.realizado);var saldo=mt.orcado-rA;
    var pct=mt.orcado>0?Math.round(rA/mt.orcado*100):0;
    var t=document.createElement('div');
    t.className='month-tab'+(m===sel?' active':'')+(isFut?' future':'');
    t.innerHTML='<div class="mtname">'+m.slice(0,3)+'</div><div class="mtsaldo '+(saldo>=0?'val-pos':'val-neg')+'">'+fmtK(saldo)+'</div><div class="mtpct">'+(isFut?'previsto':pct+'% util.')+'</div>';
    t.onclick=(function(mm){return function(){sel=mm;renderAll();renderStrip();}})(m);
    s.appendChild(t);
  });
}

  });

    h+='<div class="kpi-row"><div class="kpi"><div class="kpi-label">YTD Forecast</div><div class="kpi-val">'+fmtK(ytdO)+'</div></div><div class="kpi"><div class="kpi-label">YTD Real.</div><div class="kpi-val">'+fmtK(ytdR)+'</div></div><div class="kpi"><div class="kpi-label">YTD Saldo</div><div class="kpi-val '+(ytdS>=0?'val-pos':'val-neg')+'">'+fmtK(ytdS)+'</div></div></div>';
    if(excess.length){h+='<div class="detail-section"><div class="ds-title">&#128308; Maiores estouros</div>';excess.forEach(function(l){var bw=Math.min(100,Math.round(l.pct*100));h+='<div class="detail-item"><div><div class="di-name">'+l.conta+'</div><div class="di-bar-wrap"><div class="di-bar" style="width:'+bw+'%;background:var(--red)"></div></div></div><div class="di-meta"><div class="di-saldo val-neg">'+fmt(l.saldo,false)+'</div><div class="di-pct">'+Math.round(l.pct*100)+'%</div></div></div>';});h+='</div>';}
    if(econ.length){h+='<div class="detail-section"><div class="ds-title">&#128994; Maiores economias</div>';econ.forEach(function(l){var bw=Math.min(100,Math.round(l.pct*100));h+='<div class="detail-item"><div><div class="di-name">'+l.conta+'</div><div class="di-bar-wrap"><div class="di-bar" style="width:'+bw+'%;background:var(--green)"></div></div></div><div class="di-meta"><div class="di-saldo val-pos">'+fmt(l.saldo,false)+'</div><div class="di-pct">'+Math.round(l.pct*100)+'%</div></div></div>';});h+='</div>';}
  }
  h+='<div class="insight-box"><div class="ib-title">Análise do ano</div><div class="ib-item">Melhor mês: <strong>'+best.m+'</strong> ('+fmt(best.s,false)+')</div><div class="ib-item">Pior mês: <strong>'+worst.m+'</strong> ('+fmt(worst.s,false)+')</div><div class="ib-item">YTD: '+(ytdS>=0?'<strong class="val-pos">dentro do forecast</strong>':'<strong class="val-neg">acima do forecast</strong>')+' em <strong>'+fmt(Math.abs(ytdS),false)+'</strong></div></div>';
  document.getElementById('saldoPanel').innerHTML=h;
}

function openHelp(){alert('Guia:\n\nAtualizar: edite o Sheets e clique Atualizar do Sheets.\nForecast = or\u00e7amento revisado.\nRealizado = valores gastos.\nSaldo positivo = economia. Negativo = estouro.');}

setStatus('ok','Dados locais carregados');
renderAll();
atualizarDoSheets();
</script>
</body>
