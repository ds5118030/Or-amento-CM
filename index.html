<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Orçamentário — Diretoria Comercial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#00148A;--laranja:#FF8C00;--bg:#F6F6F6;--white:#fff;--border:#D0D5E8;--text:#1a1a2e;--muted:#6B7280;--green:#16a34a;--red:#dc2626;--amber:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Carlito','Calibri',sans-serif;font-size:13px;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:62px;background:var(--azul);position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;right:0;top:0;bottom:0;width:100px;background:var(--laranja);clip-path:polygon(40% 0,100% 0,100% 100%,0% 100%);}
.hdr-logo{height:32px;z-index:1;display:flex;align-items:center;}
.hdr-logo svg{height:26px;width:auto;}
.hdr-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;z-index:1;}
.hdr-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;display:flex;align-items:center;gap:5px;justify-content:center;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot.ok{background:#4ade80;}.dot.loading{background:#fbbf24;animation:pulse 1s infinite;}.dot.warn{background:#fbbf24;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-actions{display:flex;gap:8px;z-index:1;}
.btn{padding:7px 16px;border-radius:4px;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.02em;}
.btn-primary{background:var(--laranja);color:#fff;}
.btn-outline{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);}
.month-strip{display:flex;overflow-x:auto;background:#0F1F8C;border-bottom:3px solid var(--laranja);}
.month-tab{min-width:85px;padding:8px 10px;text-align:center;cursor:pointer;border-right:1px solid rgba(255,255,255,.1);border-bottom:3px solid transparent;flex:1;}
.month-tab:hover{background:rgba(255,255,255,.08);}
.month-tab.active{background:rgba(255,255,255,.12);border-bottom-color:var(--laranja);}
.month-tab.future{opacity:.5;}
.mtname{font-size:10px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;}
.month-tab.active .mtname{color:var(--laranja);}
.mtsaldo{font-size:13px;font-weight:700;margin-top:2px;}
.mtpct{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px;}
.main{display:flex;height:calc(100vh - 110px);overflow:hidden;}
.left-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.filters-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;}
.filter-select,.search-input{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px 10px;font-size:11px;font-family:inherit;}
.search-input{width:200px;}
.ml-auto{margin-left:auto;}
.table-panel{flex:1;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead{position:sticky;top:0;z-index:10;}
thead tr{background:var(--azul);}
th{padding:10px 14px;text-align:right;font-weight:700;font-size:11px;color:#fff;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
th:first-child{text-align:left;min-width:220px;position:sticky;left:0;background:var(--azul);z-index:11;}
td{padding:9px 14px;border-bottom:1px solid #E8ECF5;text-align:right;white-space:nowrap;background:#fff;}
td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:5;}
tr:hover td{background:#EEF1FA;}
tr:hover td:first-child{background:#EEF1FA;}
.row-group td{padding:6px 14px;background:#E8ECF5!important;font-weight:700;font-size:10px;color:var(--azul);letter-spacing:.08em;text-transform:uppercase;border-top:2px solid var(--azul);}
.row-total td{font-weight:700;font-size:13px;border-top:2px solid var(--laranja);background:#FFF8F0!important;color:var(--azul);}
.val-pos{color:var(--green);font-weight:600;}.val-neg{color:var(--red);font-weight:600;}.val-warn{color:var(--amber);font-weight:600;}.val-zero{color:var(--muted);}
.tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;margin-left:5px;}
.tag-estouro{background:#FEE2E2;color:var(--red);}.tag-atencao{background:#FEF3C7;color:#92400E;}
.saldo-panel{width:295px;border-left:3px solid var(--laranja);overflow-y:auto;background:#fff;flex-shrink:0;}
.saldo-hdr{padding:13px 15px 10px;background:var(--azul);}
.saldo-hdr-title{font-size:13px;font-weight:700;color:#fff;}
.saldo-hdr-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;}
.saldo-big{padding:15px;border-bottom:2px solid var(--border);}
.sb-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.sb-value{font-size:24px;font-weight:700;margin-top:4px;}
.sb-row{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--muted);}
.sb-row strong{color:var(--text);}
.kpi-row{display:flex;border-bottom:1px solid var(--border);}
.kpi{flex:1;padding:10px 12px;border-right:1px solid var(--border);}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.kpi-val{font-size:14px;font-weight:700;margin-top:3px;color:var(--azul);}
.sec-title{font-size:10px;font-weight:700;color:#fff;letter-spacing:.06em;text-transform:uppercase;background:#0F1F8C;padding:6px 14px;}
.detail-item{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 14px;border-bottom:1px solid #E8ECF5;gap:8px;}
.detail-item:last-child{border-bottom:none;}
.di-name{font-size:11px;font-weight:600;color:var(--text);flex:1;line-height:1.3;}
.di-val{font-size:12px;font-weight:700;}
.di-pct{font-size:10px;color:var(--muted);}
.di-bar-wrap{width:100%;height:3px;background:#E8ECF5;border-radius:2px;margin-top:3px;}
.di-bar{height:100%;border-radius:2px;}
.insight-box{margin:12px;background:#F0F4FF;border-left:3px solid var(--laranja);border-radius:4px;padding:12px;}
.ib-title{font-size:11px;font-weight:700;color:var(--azul);margin-bottom:7px;}
.ib-item{font-size:11px;color:var(--muted);margin-bottom:4px;padding-left:10px;position:relative;}
.ib-item::before{content:"\25B8";position:absolute;left:0;color:var(--laranja);}
.ib-item strong{color:var(--text);}
.footer{background:var(--azul);color:rgba(255,255,255,.5);font-size:10px;text-align:center;padding:6px;border-top:2px solid var(--laranja);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

    <div class="hdr-sub"><span class="dot ok" id="sDot"></span><span id="sTxt">Carregando...</span></div>

  <div class="hdr-actions">
    <button class="btn btn-outline" onclick="openHelp()">? Guia</button>
    <button class="btn btn-primary" id="btnAtualizar" onclick="atualizarDoSheets()">&#8635; Atualizar do Sheets</button>
  </div>
</div>
<div class="month-strip" id="monthStrip"></div>
<div class="main">
  <div class="left-panel">
    <div class="filters-bar">
      <select class="filter-select" id="filterGroup" onchange="renderTable()">
        <option value="">Todos os grupos</option>

      </select>

        <input type="checkbox" id="showOnlyActive" onchange="renderTable()"> S&#243; com movimento
      </label>
    </div>
    <div class="table-panel"><table id="budgetTable"></table></div>
  </div>
  <div class="saldo-panel" id="saldoPanel"></div>
</div>

var sel='AGOSTO';

function setStatus(cls,msg){document.getElementById('sDot').className='dot '+cls;document.getElementById('sTxt').textContent=msg;}

function parseCSV(text){
  var lines=text.split('\n');
  if(lines.length<2)return[];
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line)continue;
    if(line.charAt(0)==='"'&&line.charAt(line.length-1)==='"')line=line.slice(1,-1);
    line=line.replace(/""/g,'\u00a7');
    var parts=line.split(',');
    if(parts.length<5)continue;
    var rel=parts[0].replace(/\u00a7/g,'"').trim();
    var mes=parts[1].replace(/\u00a7/g,'"').trim();
    var grp=parts[2].replace(/\u00a7/g,'"').trim();
    var conta=parts[3].replace(/\u00a7/g,'"').trim();
    var vr=parts.slice(4).join(',').replace(/\u00a7/g,'"').replace(/"/g,'').trim();
    var val=0;
    if(vr.indexOf(',')>=0&&vr.indexOf('.')>=0)val=parseFloat(vr.replace(/\./g,'').replace(',','.'))||0;
    else if(vr.indexOf(',')>=0)val=parseFloat(vr.replace(',','.'))||0;
    else val=parseFloat(vr)||0;
    rows.push({rel:rel,mes:mes,grp:grp,conta:conta,val:val});
  }
  return rows;
}

function buildData(rows){
  var lmap={};var mt={};
  MONTHS.forEach(function(m){mt[m]={orcado:0,realizado:0};});
  rows.forEach(function(r){
    var tipo=r.rel.toUpperCase();var mes=r.mes.toUpperCase();
    var grp=r.grp.toUpperCase()||'DESPESAS';var conta=r.conta;var val=r.val;
    if(!conta||tipo.indexOf('---')>=0||MONTHS.indexOf(mes)<0)return;
    if(!lmap[conta]){lmap[conta]={conta:conta,agrupamento:grp,meses:{}};MONTHS.forEach(function(m){lmap[conta].meses[m]={orcado:0,realizado:0};});}
    var isOrc=tipo.indexOf('FORE')>=0||tipo.indexOf('ORC')>=0;
    var isReal=tipo.indexOf('REAL')>=0;
    if(isOrc){lmap[conta].meses[mes].orcado+=val;mt[mes].orcado+=val;}
    else if(isReal){lmap[conta].meses[mes].realizado+=val;mt[mes].realizado+=val;}
  });
  return{lines:Object.values(lmap).sort(function(a,b){return a.conta.localeCompare(b.conta,'pt-BR');}),month_totals:mt,month_order:MONTHS};
}

function atualizarDoSheets(){
  var btn=document.getElementById('btnAtualizar');
  btn.textContent='\u23f3 Buscando...';btn.disabled=true;
  setStatus('loading','Buscando dados do Sheets...');
  fetch(SHEETS_URL+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(text){
      var rows=parseCSV(text);
      if(rows.length===0)throw new Error('CSV vazio');
      var nd=buildData(rows);
      if(nd.lines.length===0)throw new Error('Sem linhas');
      DATA=nd;
      setStatus('ok','Sheets \u00b7 '+new Date().toLocaleTimeString('pt-BR'));
      renderAll();
    })
    .catch(function(e){
      setStatus('warn','Sheets indispon\u00edvel \u00b7 dados locais');
      console.error(e);
    })
    .finally(function(){
      btn.textContent='\u8635 Atualizar do Sheets';btn.disabled=false;
    });
}

function fmt(v){if(v===0)return'<span class="val-zero">\u2014</span>';return'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtS(v){if(v===0)return'\u2014';var s=v>0?'+':'-';return s+'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtK(v){var a=Math.abs(v);if(a>=1e6)return(v<0?'-':'')+'R$\u00a0'+(a/1e6).toFixed(1)+'M';if(a>=1e3)return(v<0?'-':'')+'R$\u00a0'+(a/1e3).toFixed(0)+'k';return(v<0?'-':'')+'R$\u00a0'+a.toFixed(0);}

function renderAll(){renderStrip();renderTable();renderSaldo();}

function renderStrip(){
  var s=document.getElementById('monthStrip');s.innerHTML='';
  MONTHS.forEach(function(m){
    var mt=DATA.month_totals[m];var isFut=COM_REAL.indexOf(m)<0;
    var rA=Math.abs(mt.realizado);var saldo=mt.orcado-rA;
    var pct=mt.orcado>0?Math.round(rA/mt.orcado*100):0;
    var sCls=saldo>=0?'val-pos':'val-neg';
    var t=document.createElement('div');
    t.className='month-tab'+(m===sel?' active':'')+(isFut?' future':'');
    t.innerHTML='<div class="mtname">'+m.slice(0,3)+'</div><div class="mtsaldo '+sCls+'">'+fmtK(saldo)+'</div><div class="mtpct">'+(isFut?'previsto':pct+'% util.')+'</div>';
    t.onclick=(function(mm){return function(){sel=mm;renderAll();};})(m);
    s.appendChild(t);
  });
}

function renderTable(){
  if(!DATA)return;
  var grpF=document.getElementById('filterGroup').value;
  var srch=document.getElementById('searchInput').value.toLowerCase();
  var actF=document.getElementById('showOnlyActive').checked;
  var m=sel;var isFut=COM_REAL.indexOf(m)<0;
  var lines=DATA.lines.filter(function(l){
    if(grpF&&l.agrupamento!==grpF)return false;
    if(srch&&l.conta.toLowerCase().indexOf(srch)<0)return false;
    if(actF){var mv=l.meses[m];if(!mv||(mv.orcado===0&&mv.realizado===0))return false;}
    return true;
  });
  var groups={};lines.forEach(function(l){if(!groups[l.agrupamento])groups[l.agrupamento]=[];groups[l.agrupamento].push(l);});
  var cols=isFut?2:5;
  var h='<thead><tr><th>Conta</th><th>Forecast</th>'+(isFut?'':'<th>Realizado</th><th>Saldo</th><th>% Util.</th>')+'</tr></thead><tbody>';
  var totOrc=0,totReal=0;
  ['COMISS\u00d5ES','DESPESAS','FOLHA'].forEach(function(grp){
    if(!groups[grp])return;
    h+='<tr class="row-group"><td colspan="'+cols+'">'+grp+'</td></tr>';
    groups[grp].forEach(function(l){
      var mv=l.meses[m]||{orcado:0,realizado:0};
      var orc=mv.orcado;var real=mv.realizado;var rA=Math.abs(real);
      var saldo=orc-rA;var pct=orc>0?rA/orc:(rA>0?99:0);
      totOrc+=orc;totReal+=rA;
      var sCls='val-zero';var tag='';
      if(!isFut&&real!==0){
        if(saldo<0){sCls='val-neg';tag='<span class="tag tag-estouro">ESTOURO</span>';}
        else if(pct>0.85){sCls='val-warn';tag='<span class="tag tag-atencao">ATEN\u00c7\u00c3O</span>';}
        else sCls='val-pos';
      }
      h+='<tr><td>'+l.conta+tag+'</td><td>'+fmt(orc)+'</td>';
      if(!isFut){
        h+='<td>'+fmt(rA)+'</td>';
        h+='<td><span class="'+sCls+'">'+fmtS(saldo)+'</span></td>';
        h+='<td><span class="'+sCls+'">'+(real===0?'\u2014':(pct>9?'>999%':Math.round(pct*100)+'%'))+'</span></td>';
      }
      h+='</tr>';
    });
  });
  var totS=totOrc-totReal;var sCls2=totS>=0?'val-pos':'val-neg';
  h+='<tr class="row-total"><td>TOTAL GERAL</td><td>'+fmt(totOrc)+'</td>';
  if(!isFut){var pT=totOrc>0?Math.round(totReal/totOrc*100):0;h+='<td>'+fmt(totReal)+'</td><td><span class="'+sCls2+'">'+fmtS(totS)+'</span></td><td><span class="'+sCls2+'">'+pT+'%</span></td>';}
  h+='</tr></tbody>';
  document.getElementById('budgetTable').innerHTML=h;
}

function renderSaldo(){
  if(!DATA)return;
  var m=sel;var mt=DATA.month_totals[m];
  var isFut=COM_REAL.indexOf(m)<0;var rA=Math.abs(mt.realizado);
  var saldo=mt.orcado-rA;var pct=mt.orcado>0?rA/mt.orcado:0;var sCls=saldo>=0?'val-pos':'val-neg';
  var ld=DATA.lines.map(function(l){var mv=l.meses[m]||{orcado:0,realizado:0};var r=Math.abs(mv.realizado);return{conta:l.conta,saldo:mv.orcado-r,pct:mv.orcado>0?r/mv.orcado:(r>0?99:0),hasR:mv.realizado!==0};});
  var excess=ld.filter(function(l){return l.saldo<0&&l.hasR;}).sort(function(a,b){return a.saldo-b.saldo;}).slice(0,5);
  var econ=ld.filter(function(l){return l.saldo>0&&l.hasR;}).sort(function(a,b){return b.saldo-a.saldo;}).slice(0,5);
  var ytdO=COM_REAL.reduce(function(s,x){return s+DATA.month_totals[x].orcado;},0);
  var ytdR=COM_REAL.reduce(function(s,x){return s+Math.abs(DATA.month_totals[x].realizado);},0);
  var ytdS=ytdO-ytdR;
  var best=COM_REAL.map(function(x){return{m:x,s:DATA.month_totals[x].orcado-Math.abs(DATA.month_totals[x].realizado)};}).sort(function(a,b){return b.s-a.s;})[0];
  var worst=COM_REAL.map(function(x){return{m:x,s:DATA.month_totals[x].orcado-Math.abs(DATA.month_totals[x].realizado)};}).sort(function(a,b){return a.s-b.s;})[0];
  var h='<div class="saldo-hdr"><div class="saldo-hdr-title">Saldo \u2014 '+m+'</div><div class="saldo-hdr-sub">'+(isFut?'Sem realizado ainda':'Per\u00edodo encerrado')+'</div></div>';
  if(isFut){
    h+='<div class="saldo-big"><div class="sb-label">Forecast Previsto</div><div class="sb-value val-pos">'+fmt(mt.orcado)+'</div></div>';
  }else{
    h+='<div class="saldo-big"><div class="sb-label">Saldo do M\u00eas</div><div class="sb-value '+sCls+'">'+fmtS(saldo)+'</div>';
    h+='<div class="sb-row"><span>Forecast</span><strong>'+fmt(mt.orcado)+'</strong></div>';
    h+='<div class="sb-row"><span>Realizado</span><strong>'+fmt(rA)+'</strong></div>';
    h+='<div class="sb-row"><span>Utiliza\u00e7\u00e3o</span><strong class="'+sCls+'">'+Math.round(pct*100)+'%</strong></div></div>';
    h+='<div class="kpi-row"><div class="kpi"><div class="kpi-label">YTD Forecast</div><div class="kpi-val">'+fmtK(ytdO)+'</div></div><div class="kpi"><div class="kpi-label">YTD Real.</div><div class="kpi-val">'+fmtK(ytdR)+'</div></div><div class="kpi"><div class="kpi-label">YTD Saldo</div><div class="kpi-val '+(ytdS>=0?'val-pos':'val-neg')+'">'+fmtK(ytdS)+'</div></div></div>';
    if(excess.length){
      h+='<div class="sec-title">&#128308; Maiores Estouros</div>';
      excess.forEach(function(l){var bw=Math.min(100,Math.round(l.pct*100));h+='<div class="detail-item"><div style="flex:1"><div class="di-name">'+l.conta+'</div><div class="di-bar-wrap"><div class="di-bar" style="width:'+bw+'%;background:var(--red)"></div></div></div><div style="text-align:right"><div class="di-val val-neg">'+fmtS(l.saldo)+'</div><div class="di-pct">'+Math.round(l.pct*100)+'%</div></div></div>';});
    }
    if(econ.length){
      h+='<div class="sec-title">&#128994; Maiores Economias</div>';
      econ.forEach(function(l){var bw=Math.min(100,Math.round(l.pct*100));h+='<div class="detail-item"><div style="flex:1"><div class="di-name">'+l.conta+'</div><div class="di-bar-wrap"><div class="di-bar" style="width:'+bw+'%;background:var(--green)"></div></div></div><div style="text-align:right"><div class="di-val val-pos">'+fmtS(l.saldo)+'</div><div class="di-pct">'+Math.round(l.pct*100)+'%</div></div></div>';});
    }
  }
  h+='<div class="insight-box"><div class="ib-title">An\u00e1lise do Ano</div>';
  h+='<div class="ib-item">Melhor m\u00eas: <strong>'+best.m+'</strong> ('+fmt(best.s)+')</div>';
  h+='<div class="ib-item">Pior m\u00eas: <strong>'+worst.m+'</strong> ('+fmt(worst.s)+')</div>';
  h+='<div class="ib-item">YTD: '+(ytdS>=0?'<strong class="val-pos">dentro do forecast</strong>':'<strong class="val-neg">acima do forecast</strong>')+' em <strong>'+fmt(Math.abs(ytdS))+'</strong></div></div>';
  document.getElementById('saldoPanel').innerHTML=h;
}

function openHelp(){
  alert('GUIA DE USO\n\n1. Edite os valores no Google Sheets\n2. Clique em Atualizar do Sheets\n3. Os dados ser\u00e3o atualizados\n\nForecast = or\u00e7amento revisado 2026\nRealizado = valores gastos\nSaldo positivo = economia\nSaldo negativo = estouro');
}

setStatus('ok','Dados locais carregados');
renderAll();
atualizarDoSheets();

</script>
